[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/sim",
    "crates/content",
    "crates/save",
    "crates/tools",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.93"
authors = ["The Contributors"]
repository = "https://github.com/vibetorio/vibetorio"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_sprite", "bevy_ui", "bevy_text", "png", "x11"] }
bevy_ecs = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
